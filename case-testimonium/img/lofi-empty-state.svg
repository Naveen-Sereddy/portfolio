<svg viewBox="0 0 800 500" width="800" height="500" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<rect width="800" height="500" fill="#FFFFFF"/>
<!-- top bar -->
<rect x="0" y="0" width="800" height="54" fill="#FFFFFF"/>
<line x1="0" y1="54" x2="800" y2="54" stroke="#E5E5E5"/>
<text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#4A4A4A">Testimonium</text>
<rect x="612" y="15" width="98" height="24" rx="12" fill="#E3E3E3" stroke="#C9C9C9"/>
<text x="661" y="31" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#4A4A4A">+ New Thread</text>
<circle cx="732" cy="27" r="13" fill="none" stroke="#E5E5E5"/>
<circle cx="768" cy="27" r="13" fill="none" stroke="#E5E5E5"/>
<!-- sidebar -->
<rect x="0" y="54" width="168" height="446" fill="#F7F7F7"/>
<line x1="168" y1="54" x2="168" y2="500" stroke="#E5E5E5"/>
<text x="16" y="80" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" letter-spacing="1" fill="#B0B0B0">RECENT</text>
<text x="16" y="112" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#B0B0B0">No conversations yet.</text>
<text x="16" y="126" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#B0B0B0">Upload a document to start.</text>
<!-- doc info bar -->
<rect x="168" y="54" width="632" height="42" fill="#FFFFFF"/>
<line x1="168" y1="96" x2="800" y2="96" stroke="#E5E5E5"/>
<rect x="193" y="68" width="12" height="15" rx="2" fill="none" stroke="#C9C9C9"/>
<text x="215" y="80" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#4A4A4A">sample-10k.pdf · 112 pages · ~118K tokens</text>
<text x="772" y="80" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#B0B0B0">×</text>
<!-- empty state center -->
<circle cx="484" cy="196" r="24" fill="#F7F7F7" stroke="#E5E5E5"/>
<circle cx="484" cy="196" r="4" fill="#C9C9C9"/>
<text x="484" y="252" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#4A4A4A">What do you want to know?</text>
<text x="484" y="274" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A8A8A">Ask a question about your document. I&#8217;ll find the most</text>
<text x="484" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#8A8A8A">relevant passages and answer with citations.</text>
<rect x="316" y="308" width="150" height="26" rx="13" fill="none" stroke="#C9C9C9"/>
<text x="391" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4A4A4A">Summarize key findings</text>
<rect x="474" y="308" width="150" height="26" rx="13" fill="none" stroke="#C9C9C9"/>
<text x="549" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4A4A4A">What are the main policies?</text>
<rect x="632" y="308" width="132" height="26" rx="13" fill="none" stroke="#C9C9C9"/>
<text x="698" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#4A4A4A">Extract action items</text>
<!-- composer -->
<line x1="168" y1="432" x2="800" y2="432" stroke="#E5E5E5"/>
<rect x="193" y="450" width="583" height="34" rx="17" fill="#F7F7F7" stroke="#E5E5E5"/>
<text x="211" y="471" font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#B0B0B0">Ask anything about your document&#8230;</text>
<circle cx="746" cy="467" r="12" fill="#E3E3E3"/>
<path d="M 746 462 v9 m-4 -5 l4 -4 l4 4" stroke="#8A8A8A" fill="none" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
